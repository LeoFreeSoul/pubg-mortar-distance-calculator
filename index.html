<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PUBG 迫击炮测距</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 6px;
      background: #c0c0c0;
      color: #000;
      font: 12px "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .window {
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
    }
    .title-bar {
      padding: 4px 7px;
      background: #000080;
      color: #fff;
      font-weight: bold;
    }
    .content { padding: 10px; }
    .hint { line-height: 1.7; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .row label { flex: none; }
    input {
      width: 90px;
      padding: 3px 5px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
      font: inherit;
    }
    button {
      padding: 3px 12px;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      background: #c0c0c0;
      font: inherit;
      cursor: pointer;
    }
    #keybind-status { color: #006000; }
    #calibration-shortcut { color: #000080; }
    #calibration-status { color: #000080; margin-bottom: 10px; }
    .result { display: flex; align-items: center; gap: 8px; }
    #result-distance {
      flex: 1;
      padding: 4px 8px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
      background: #fff;
      color: #800000;
      font: bold 24px Consolas, monospace;
      text-align: right;
    }
    .status {
      border-top: 1px solid #808080;
      padding: 4px 8px;
      color: #000080;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">PUBG 迫击炮测距</div>
    <div class="content">
      <div class="hint">先校准 100 米，再按快捷键测距。<br>先点炮位，再点目标；换图或缩放后请重校。</div>
      <div class="row">
        <label for="keybind-input">测距快捷键</label>
        <input id="keybind-input" value="Y" aria-label="测距快捷键">
        <button id="btn-set-keybind">设置</button>
        <span id="keybind-status"></span>
      </div>
      <div class="row">
        <button id="btn-calibrate">校准 100 米</button>
        <span id="calibration-shortcut">Alt+Y</span>
        <button id="btn-clear-calibration">清除校准</button>
      </div>
      <div id="calibration-status">当前比例：未校准｜请按 Alt+Y 校准</div>
      <div class="result">
        <span>距离</span>
        <span id="result-distance">---</span>
        <span>米</span>
      </div>
    </div>
    <div class="status" id="status-msg">未校准，请先按 Alt+Y 校准 100 米</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const keybindInput = document.getElementById('keybind-input');
    const keybindStatus = document.getElementById('keybind-status');
    const calibrationShortcut = document.getElementById('calibration-shortcut');
    const calibrationStatus = document.getElementById('calibration-status');
    const resultDistance = document.getElementById('result-distance');
    const status = document.getElementById('status-msg');

    function showUncalibrated(message) {
      calibrationStatus.textContent = '当前比例：未校准｜请按 Alt+Y 校准';
      resultDistance.textContent = '---';
      status.textContent = message;
    }

    ipcRenderer.invoke('get-calibration-shortcut').then(({ keybind, available }) => {
      calibrationShortcut.textContent = available ? keybind : `${keybind} 不可用`;
      if (!available) calibrationShortcut.style.color = '#b00000';
    });

    ipcRenderer.on('calibration-cleared', (_, message) => {
      showUncalibrated(message);
    });

    ipcRenderer.on('measurement-blocked', () => {
      status.textContent = '未校准，请先按 Alt+Y 校准 100 米';
    });

    ipcRenderer.on('measurement-completed', (_, distance) => {
      resultDistance.textContent = distance;
      status.textContent = `测距完成：${distance} 米`;
    });

    ipcRenderer.on('calibration-completed', (_, scale) => {
      calibrationStatus.textContent = `当前比例：已校准｜100 米 = ${scale.toFixed(1)} 像素`;
      status.textContent = '校准完成；改变地图缩放后请重新校准';
    });

    ipcRenderer.on('calibration-invalid', (_, message) => {
      status.textContent = message;
    });

    ipcRenderer.on('capture-cancelled', (_, mode) => {
      status.textContent = mode === 'calibrate' ? '已取消校准，当前未校准' : '已取消测距';
    });

    ipcRenderer.on('keybind-result', (_, ok) => {
      keybindStatus.textContent = ok ? '✓ 已设置' : '✗ 设置失败';
      keybindStatus.style.color = ok ? '#006000' : '#b00000';
      if (!ok) status.textContent = '快捷键不可用，请换一个';
      if (ok) localStorage.setItem('mortar-keybind', keybindInput.value.trim());
    });

    document.getElementById('btn-set-keybind').addEventListener('click', () => {
      const keybind = keybindInput.value.trim();
      if (keybind) ipcRenderer.send('set-keybind', keybind);
    });

    document.getElementById('btn-calibrate').addEventListener('click', () => {
      status.textContent = '请点击地图中一个 100 米小格同一条边的两端';
      ipcRenderer.send('start-calibration');
    });

    document.getElementById('btn-clear-calibration').addEventListener('click', () => {
      showUncalibrated('已清除校准，请按 Alt+Y 重新校准');
      ipcRenderer.send('clear-calibration');
    });

    let savedKeybind = localStorage.getItem('mortar-keybind');
    if (!savedKeybind) {
      try {
        savedKeybind = JSON.parse(localStorage.getItem('mortar-settings') || '{}').keybind;
      } catch (_) {}
    }
    keybindInput.value = savedKeybind || 'Y';
    ipcRenderer.send('set-keybind', keybindInput.value.trim());
  </script>
</body>
</html>
