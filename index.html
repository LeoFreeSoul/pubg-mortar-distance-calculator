<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PUBG 迫击炮测距</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 6px;
      background: #c0c0c0;
      color: #000;
      font: 12px "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .window {
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
    }
    .title-bar {
      padding: 4px 7px;
      background: #000080;
      color: #fff;
      font-weight: bold;
    }
    .content { padding: 10px; }
    .hint { line-height: 1.7; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .row label { flex: none; }
    input, select {
      width: 90px;
      padding: 3px 5px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
      font: inherit;
    }
    select { width: 180px; background: #fff; }
    button {
      padding: 3px 12px;
      border: 2px solid;
      border-color: #fff #808080 #808080 #fff;
      background: #c0c0c0;
      font: inherit;
      cursor: pointer;
    }
    #keybind-status { color: #006000; }
    #calibration-shortcut { color: #000080; }
    #calibration-status { color: #000080; margin-bottom: 10px; }
    .result { display: flex; align-items: center; gap: 8px; }
    #result-distance {
      flex: 1;
      padding: 4px 8px;
      border: 2px solid;
      border-color: #808080 #fff #fff #808080;
      background: #fff;
      color: #800000;
      font: bold 24px Consolas, monospace;
      text-align: right;
    }
    .status {
      border-top: 1px solid #808080;
      padding: 4px 8px;
      color: #000080;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">PUBG 迫击炮测距</div>
    <div class="content">
      <div class="hint">选择地图；非最大缩放时，先校准 100 米。<br>按快捷键测距：先点炮位，再点目标；Esc 取消。</div>
      <div class="row">
        <label for="map-select">当前地图</label>
        <select id="map-select" aria-label="当前地图">
          <option value="erangel">艾伦格（8×8 公里）</option>
          <option value="miramar">米拉玛（8×8 公里）</option>
          <option value="taego">泰戈（8×8 公里）</option>
          <option value="deston">帝斯顿（8×8 公里）</option>
          <option value="rondo">荣都（8×8 公里）</option>
          <option value="vikendi">维寒迪（8×8 公里）</option>
          <option value="sanhok">萨诺（4×4 公里）</option>
          <option value="paramo">帕拉莫（3×3 公里）</option>
          <option value="karakin">卡拉金（2×2 公里）</option>
        </select>
      </div>
      <div class="row">
        <label for="keybind-input">测距快捷键</label>
        <input id="keybind-input" value="Y" aria-label="测距快捷键">
        <button id="btn-set-keybind">设置</button>
        <span id="keybind-status"></span>
      </div>
      <div class="row">
        <button id="btn-calibrate">校准 100 米</button>
        <span id="calibration-shortcut">Alt+Y</span>
        <button id="btn-reset-calibration">恢复自动</button>
      </div>
      <div id="calibration-status">当前比例：自动估算</div>
      <div class="result">
        <span>距离</span>
        <span id="result-distance">---</span>
        <span>米</span>
      </div>
    </div>
    <div class="status" id="status-msg">就绪</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const keybindInput = document.getElementById('keybind-input');
    const keybindStatus = document.getElementById('keybind-status');
    const calibrationShortcut = document.getElementById('calibration-shortcut');
    const calibrationStatus = document.getElementById('calibration-status');
    const mapSelect = document.getElementById('map-select');
    const resultDistance = document.getElementById('result-distance');
    const status = document.getElementById('status-msg');
    const mapSizeKm = {
      erangel: 8, miramar: 8, taego: 8, deston: 8, rondo: 8, vikendi: 8,
      sanhok: 4, paramo: 3, karakin: 2
    };
    const savedMap = localStorage.getItem('mortar-map');
    mapSelect.value = Object.hasOwn(mapSizeKm, savedMap) ? savedMap : 'erangel';
    let pxPer100m = 147;
    let autoPxPer100m = 147;
    let baseAutoPxPer100m = 147;
    let calibrated = false;

    function updateScaleDisplay() {
      calibrationStatus.textContent = calibrated
        ? `当前比例：已校准｜100 米 = ${pxPer100m.toFixed(1)} 像素`
        : `当前比例：自动估算｜100 米 ≈ ${autoPxPer100m.toFixed(1)} 像素`;
    }

    function updateAutoScale() {
      autoPxPer100m = baseAutoPxPer100m * 8 / mapSizeKm[mapSelect.value];
      if (!calibrated) pxPer100m = autoPxPer100m;
      updateScaleDisplay();
    }

    ipcRenderer.invoke('get-scale').then(({ pxPer100m: scale }) => {
      baseAutoPxPer100m = scale;
      updateAutoScale();
    }).catch(() => {
      status.textContent = '读取屏幕比例尺失败';
    });

    ipcRenderer.invoke('get-calibration-shortcut').then(({ keybind, available }) => {
      calibrationShortcut.textContent = available ? keybind : `${keybind} 不可用`;
      if (!available) calibrationShortcut.style.color = '#b00000';
    });

    ipcRenderer.on('points-captured', (_, points) => {
      const dx = points[1].x - points[0].x;
      const dy = points[1].y - points[0].y;
      const distance = Math.round(Math.hypot(dx, dy) / pxPer100m * 100);
      resultDistance.textContent = distance;
      status.textContent = `测距完成：${distance} 米`;
    });

    ipcRenderer.on('calibration-points-captured', (_, points) => {
      const scale = Math.hypot(
        points[1].x - points[0].x,
        points[1].y - points[0].y
      );
      if (scale < 10) {
        status.textContent = '两点太近，请重试校准';
        return;
      }
      pxPer100m = scale;
      calibrated = true;
      updateScaleDisplay();
      status.textContent = '校准完成；改变地图缩放后请重新校准';
    });

    ipcRenderer.on('capture-cancelled', () => {
      status.textContent = '已取消测距';
    });

    ipcRenderer.on('keybind-result', (_, ok) => {
      keybindStatus.textContent = ok ? '✓ 已设置' : '✗ 设置失败';
      keybindStatus.style.color = ok ? '#006000' : '#b00000';
      status.textContent = ok ? '就绪' : '快捷键不可用，请换一个';
      if (ok) localStorage.setItem('mortar-keybind', keybindInput.value.trim());
    });

    document.getElementById('btn-set-keybind').addEventListener('click', () => {
      const keybind = keybindInput.value.trim();
      if (keybind) ipcRenderer.send('set-keybind', keybind);
    });

    document.getElementById('btn-calibrate').addEventListener('click', () => {
      status.textContent = '请点击地图中一个 100 米小格同一条边的两端';
      ipcRenderer.send('start-calibration');
    });

    mapSelect.addEventListener('change', () => {
      calibrated = false;
      localStorage.setItem('mortar-map', mapSelect.value);
      resultDistance.textContent = '---';
      updateAutoScale();
      status.textContent = '地图已切换；自动比例仅适用于最大缩放';
    });

    document.getElementById('btn-reset-calibration').addEventListener('click', () => {
      calibrated = false;
      pxPer100m = autoPxPer100m;
      updateScaleDisplay();
      status.textContent = '已恢复自动比例尺（适用于地图最大缩放）';
    });

    let savedKeybind = localStorage.getItem('mortar-keybind');
    if (!savedKeybind) {
      try {
        savedKeybind = JSON.parse(localStorage.getItem('mortar-settings') || '{}').keybind;
      } catch (_) {}
    }
    keybindInput.value = savedKeybind || 'Y';
    ipcRenderer.send('set-keybind', keybindInput.value.trim());
  </script>
</body>
</html>
