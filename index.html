<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PUBG 迫击炮测距</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #c0c0c0;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Tahoma", sans-serif;
      font-size: 11px;
      color: #000;
      padding: 4px;
      user-select: none;
    }

    .window {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
    }

    .title-bar {
      background: #000080;
      color: #ffffff;
      font-weight: bold;
      padding: 3px 4px;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .content { padding: 6px 8px; }

    .group {
      border: 1px solid #808080;
      box-shadow: inset -1px -1px #ffffff, inset 1px 1px #dfdfdf;
      padding: 8px 8px 6px 8px;
      margin-bottom: 8px;
      position: relative;
    }

    .group-label {
      position: absolute;
      top: -7px; left: 6px;
      background: #c0c0c0;
      padding: 0 3px;
    }

    .row { display: flex; align-items: center; margin-bottom: 5px; }
    .row:last-child { margin-bottom: 0; }

    label { width: 110px; flex-shrink: 0; }

    input[type="text"] {
      background: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
      box-shadow: inset 1px 1px #404040;
      padding: 2px 4px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Tahoma", sans-serif;
      font-size: 11px;
      color: #000;
      outline: none;
      flex: 1;
    }
    input[type="text"]:focus { outline: 1px dotted #000; outline-offset: -2px; }

    .display-field {
      background: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
      box-shadow: inset 1px 1px #404040;
      padding: 2px 4px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      min-width: 70px;
      text-align: right;
      display: inline-block;
      color: #000080;
    }

    .result-value {
      font-family: "Courier New", monospace;
      font-size: 18px;
      font-weight: bold;
      color: #800000;
      text-align: right;
      background: #ffffff;
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
      box-shadow: inset 1px 1px #404040;
      padding: 2px 8px;
      flex: 1;
    }

    button {
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
      padding: 3px 12px;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Tahoma", sans-serif;
      font-size: 11px;
      cursor: pointer;
    }
    button:active {
      border-top: 2px solid #808080;
      border-left: 2px solid #808080;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      padding: 4px 11px 2px 13px;
    }

    .coords-row { display: flex; gap: 8px; align-items: center; }
    .coord-label { width: 20px; flex-shrink: 0; font-weight: bold; }

    .statusbar {
      background: #c0c0c0;
      border-top: 1px solid #808080;
      padding: 2px 6px;
      font-size: 10px;
      margin-top: 4px;
    }
    .status-panel {
      border-top: 1px solid #808080;
      border-left: 1px solid #808080;
      border-bottom: 1px solid #ffffff;
      border-right: 1px solid #ffffff;
      padding: 1px 6px;
      color: #000080;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">PUBG 迫击炮测距</div>
    <div class="content">

      <!-- 使用说明 -->
      <div class="group">
        <span class="group-label">使用方法</span>
        <div style="line-height: 1.5; margin-top: 2px; color: #333;">
          1. 在游戏中打开地图并<b>放大到最大</b>，按下测距快捷键。<br>
          2. 在地图上点击迫击炮位置，再点击目标位置。<br>
          3. 程序会显示并播报距离；填写 Webhook 后也会发送到 Discord。<br>
          <b>注意：适用于正常分辨率的无边框／全屏模式，不支持拉伸分辨率。</b>
        </div>
      </div>

      <div class="group">
        <span class="group-label">Discord</span>
        <div class="row">
          <label>Webhook 地址：</label>
          <input type="text" id="webhook-url" placeholder="https://discord.com/api/webhooks/...">
        </div>
      </div>

      <div class="group">
        <span class="group-label">快捷键</span>
        <div class="row">
          <label>测距快捷键：</label>
          <input type="text" id="keybind-input" value="Y" style="width:90px;flex:none">
          <button id="btn-set-keybind" style="margin-left:6px">设置</button>
          <span id="keybind-status" style="margin-left:8px;font-size:10px;color:#008000"></span>
        </div>
        <div style="font-size:10px;color:#555">可输入：Alt+Z &nbsp;|&nbsp; Ctrl+Shift+X &nbsp;|&nbsp; F9</div>
      </div>

      <!-- 分辨率与比例尺 -->
      <div class="group">
        <span class="group-label">比例尺（自动）</span>
        <div class="row">
          <label>屏幕分辨率：</label>
          <span style="font-family:monospace" id="detected-res">检测中…</span>
        </div>
        <div class="row">
          <label>每 100 米像素：</label>
          <span style="font-family:monospace;font-weight:bold;color:#800000" id="detected-scale">...</span>
        </div>
      </div>

      <!-- 光标 -->
      <div class="group">
        <span class="group-label">光标位置</span>
        <div class="coords-row">
          <span class="coord-label">X:</span>
          <span class="display-field" id="mouse-x">0</span>
          <span class="coord-label" style="margin-left:12px">Y:</span>
          <span class="display-field" id="mouse-y">0</span>
        </div>
      </div>

      <!-- 结果 -->
      <div class="group">
        <span class="group-label">测距结果</span>
        <div class="row">
          <label>距离：</label>
          <span class="result-value" id="result-distance">---</span>
          <span style="margin-left:6px;font-weight:bold;font-size:14px">米</span>
        </div>
      </div>

    </div>

    <div class="statusbar">
      <div class="status-panel" id="status-msg">就绪。按快捷键后依次点击炮位和目标。</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let PX_PER_100M = 147; // fallback until main process responds

    const mouseXEl      = document.getElementById('mouse-x');
    const mouseYEl      = document.getElementById('mouse-y');
    const resultDistEl  = document.getElementById('result-distance');
    const statusMsg     = document.getElementById('status-msg');
    const webhookInput  = document.getElementById('webhook-url');
    const keybindInput  = document.getElementById('keybind-input');
    const keybindStatus = document.getElementById('keybind-status');
    const detectedRes   = document.getElementById('detected-res');
    const detectedScale = document.getElementById('detected-scale');

    // Fetch scale from main process on startup
    ipcRenderer.invoke('get-scale').then(({ width, height, pxPer100m }) => {
      PX_PER_100M = pxPer100m;
      detectedRes.textContent   = `${width} x ${height}`;
      detectedScale.textContent = pxPer100m.toFixed(1);
      setStatus(`就绪。比例尺：每 100 米 ${pxPer100m.toFixed(1)} 像素`);
    });

    ipcRenderer.on('mouse-position', (_, pos) => {
      mouseXEl.textContent = pos.x;
      mouseYEl.textContent = pos.y;
    });

    ipcRenderer.on('points-captured', async (_, points) => {
      const dx   = points[1].x - points[0].x;
      const dy   = points[1].y - points[0].y;
      const dist = Math.round(Math.sqrt(dx*dx + dy*dy) / PX_PER_100M * 100);

      resultDistEl.textContent = dist;
      speakDigits(dist);
      await sendToDiscord(dist, points);
    });

    ipcRenderer.on('capture-cancelled', () => setStatus('已取消测距。'));

    ipcRenderer.on('keybind-result', (_, ok) => {
      keybindStatus.textContent = ok ? '✓ 已设置' : '✗ 设置失败';
      keybindStatus.style.color = ok ? '#008000' : '#cc0000';
      setStatus(ok ? `快捷键已设置：${keybindInput.value}` : '快捷键设置失败，请换一个。');
      saveSettings();
    });

    document.getElementById('btn-set-keybind').addEventListener('click', () => {
      const kb = keybindInput.value.trim();
      if (!kb) return;
      keybindStatus.textContent = '...';
      ipcRenderer.send('set-keybind', kb);
    });

    function speakDigits(dist) {
      const utterance = new SpeechSynthesisUtterance(`${dist} 米`);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    async function sendToDiscord(dist, points) {
      const url = webhookInput.value.trim();
      if (!url) { setStatus(`测距完成：${dist} 米`); return; }

      setStatus(`测距完成：${dist} 米，正在发送到 Discord…`);

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: `🎯 **${dist}m**`
          })
        });
        setStatus(res.ok ? `已发送到 Discord：${dist} 米` : `Discord 发送失败：HTTP ${res.status}`);
      } catch (e) {
        setStatus(`发送失败：${e.message}`);
      }
    }

    function setStatus(msg) { statusMsg.textContent = msg; }

    function saveSettings() {
      localStorage.setItem('mortar-settings', JSON.stringify({
        webhook: webhookInput.value,
        keybind: keybindInput.value
      }));
    }
    webhookInput.addEventListener('input', saveSettings);
    keybindInput.addEventListener('input', saveSettings);

    try {
      const s = JSON.parse(localStorage.getItem('mortar-settings') || '{}');
      if (s.webhook) webhookInput.value = s.webhook;
      if (s.keybind) keybindInput.value = s.keybind;
    } catch(e) {}

    // Send the initial keybind to main process
    ipcRenderer.send('set-keybind', keybindInput.value.trim());
  </script>
</body>
</html>
