<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #message {
      max-width: 100%;
      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 6px;
      background: rgba(0, 0, 40, 0.88);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div id="message"></div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('show-toast', (_, message) => {
      document.getElementById('message').textContent = message;
    });
  </script>
</body>
</html>
